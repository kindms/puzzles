<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐字稿清理工具</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #3b5bdb;
    --primary-dark: #2c46b3;
    --text: #2b2d33;
    --muted: #7a7f8c;
    --border: #e2e6ef;
    --accent: #eef1fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.7rem; color: var(--primary-dark); }
  header p { color: var(--muted); margin-top: 6px; font-size: .95rem; }

  .options {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 26px;
    align-items: center;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: .95rem; user-select: none; }
  .options input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }
  .options select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: .9rem; }
  .opt-sub { color: var(--muted); }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }

  .pane {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
    display: flex;
    flex-direction: column;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--accent); border-bottom: 1px solid var(--border);
  }
  .pane-head h2 { font-size: 1rem; color: var(--primary-dark); }
  .pane-head .tools { display: flex; gap: 8px; }
  textarea, .output {
    width: 100%;
    height: 420px;
    padding: 14px;
    border: none;
    resize: vertical;
    font-size: 1rem;
    line-height: 1.9;
    font-family: inherit;
    background: transparent;
  }
  textarea:focus { outline: none; }
  .output { overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .output:empty::before { content: "整理後的結果會即時顯示在這裡"; color: var(--muted); }

  .stat { font-size: .82rem; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--border); }

  button {
    font-family: inherit;
    font-size: .88rem;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  button:hover { border-color: var(--primary); color: var(--primary); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-dark); }
  .file-btn input { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: #2b2d33; color: #fff; padding: 10px 22px; border-radius: 99px;
    font-size: .9rem; opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📝 逐字稿清理工具</h1>
    <p>貼上逐字稿或字幕，自動去時間戳記、去空格、整理標點、智慧分段</p>
  </header>

  <div class="options">
    <label><input type="checkbox" id="optTimestamp" checked> 去除時間戳記</label>
    <label><input type="checkbox" id="optJunk" checked> 去除 AI 字幕贅句</label>
    <label><input type="checkbox" id="optSpace" checked> 去除文字間空格</label>
    <label class="opt-sub"><input type="checkbox" id="optSpaceAll"> 連英文間空格也去除</label>
    <label><input type="checkbox" id="optPunct" checked> 整理標點符號</label>
    <label><input type="checkbox" id="optComma" checked> 字幕斷行補逗號</label>
    <label><input type="checkbox" id="optPara" checked> 自動分段</label>
    <label class="opt-sub">每段約
      <select id="optParaN">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="8">8</option>
      </select>
      句</label>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-head">
        <h2>原始文字</h2>
        <div class="tools">
          <label class="file-btn"><button onclick="this.parentElement.querySelector('input').click()">📂 開檔</button><input type="file" id="fileInput" accept=".txt,.srt,.vtt,.md"></label>
          <button id="btnSample">放入範例</button>
          <button id="btnClear">清空</button>
        </div>
      </div>
      <textarea id="input" placeholder="把逐字稿、SRT 字幕或 YouTube 逐字稿貼到這裡……"></textarea>
      <div class="stat" id="statIn">0 字</div>
    </div>

    <div class="pane">
      <div class="pane-head">
        <h2>整理結果</h2>
        <div class="tools">
          <button class="primary" id="btnCopy">📋 全選複製</button>
          <button id="btnDownload">⬇ 下載 .txt</button>
        </div>
      </div>
      <div class="output" id="output"></div>
      <div class="stat" id="statOut">0 字</div>
    </div>
  </div>

  <footer>
    支援格式：SRT / VTT 字幕、[00:01:23]、行首 00:01 等時間戳記<br>
    聖經章節（如「約3:16」）在文句中會自動保留，不會被當成時間戳記刪除<br>
    自動過濾 AI 語音轉文字的幻覺贅句（「請不吝點贊訂閱……」「字幕由Amara.org社群提供」等）
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== CORE-START =====
var HAN_R = '\\u4e00-\\u9fff\\u3400-\\u4dbf\\uF900-\\uFAFF\\u3040-\\u30FF';
var CJK_R = HAN_R + '\\uFF01-\\uFF5E';
var PUNCT_R = '，。！？；：、（）「」『』《》〈〉【】…—‧·';
var ALL_R = CJK_R + PUNCT_R;

function removeTimestamps(t) {
  t = t.replace(/^﻿/, '');
  // WEBVTT 標頭與註記
  t = t.replace(/^WEBVTT.*$/gm, '');
  t = t.replace(/^NOTE\b.*$/gm, '');
  // SRT / VTT 時間軸行：00:00:01,000 --> 00:00:03,500
  t = t.replace(/^.*\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d{1,3})?\s*-->\s*\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d{1,3})?.*$/gm, '');
  // SRT 序號行（整行只有數字）
  t = t.replace(/^\s*\d{1,5}\s*$/gm, '');
  // 括號包住的時間碼：[00:01:23]、(01:23)、【00:01】
  t = t.replace(/[\[（(【]\s*\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d{1,3})?\s*[\]）)】]/g, '');
  // 時:分:秒（兩個冒號）出現在任何位置都移除
  t = t.replace(/\b\d{1,2}:\d{2}:\d{2}(?:[.,]\d{1,3})?\b/g, '');
  // 分:秒（一個冒號）只移除「行首」的，避免誤刪文句中的聖經章節（如 約3:16）
  t = t.replace(/^\s*\d{1,2}:\d{2}(?:[.,]\d{1,3})?\s*/gm, '');
  return t;
}

// AI 語音轉文字（Whisper 等）在靜音段常出現的「幻覺句」
var JUNK_INLINE = [
  '請不吝點贊訂閱轉發打賞支持明鏡與點點欄目',
  '點贊訂閱轉發打賞支持明鏡與點點欄目',
  '支持明鏡與點點欄目',
  '請不吝點贊訂閱轉發打賞',
  '字幕由Amara.org社群提供',
  '由Amara.org社群提供的字幕',
  '字幕由阿木亞社群提供',
  '優優獨播劇場',
  '明鏡需要您的支持'
];
// 這些只在「整行就是這句話」時才移除，避免誤刪講員真的說的話
var JUNK_LINE_ONLY = [
  '謝謝觀看', '謝謝收看', '感謝觀看', '感謝收看', '謝謝大家觀看',
  '請訂閱', '請點贊訂閱', '訂閱按贊開啟小鈴鐺', '記得訂閱'
];

function removeJunk(t) {
  var esc = function (ch) { return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  // 字與字之間容許空格，因為原始字幕常被切開（如「請不吝點贊 訂閱 轉發」）
  var flex = function (s) { return s.split('').map(esc).join('[ \\t\\u3000]*'); };
  JUNK_INLINE.forEach(function (p) {
    t = t.replace(new RegExp(flex(p), 'g'), '');
  });
  var lineOnly = JUNK_LINE_ONLY.map(function (p) {
    return new RegExp('^[ \\t\\u3000]*' + flex(p) + '[ \\t\\u3000，。！？～!?.]*$');
  });
  t = t.split(/\r?\n/).filter(function (line) {
    return !lineOnly.some(function (re) { return re.test(line); });
  }).join('\n');
  return t;
}

function removeSpaces(t, aggressive) {
  if (aggressive) {
    return t.replace(/[ \t　]+/g, '');
  }
  // 中文字（含全形標點）之間的空格移除
  t = t.replace(new RegExp('([' + ALL_R + '])[ \\t\\u3000]+(?=[' + ALL_R + '])', 'g'), '$1');
  // 中文與英數之間的空格移除（英文單字彼此之間的空格保留）
  t = t.replace(new RegExp('([' + ALL_R + '])[ \\t\\u3000]+(?=[A-Za-z0-9])', 'g'), '$1');
  t = t.replace(new RegExp('([A-Za-z0-9])[ \\t\\u3000]+(?=[' + ALL_R + '])', 'g'), '$1');
  // 全形標點前後的空格移除
  t = t.replace(new RegExp('[ \\t\\u3000]+([' + PUNCT_R + '])', 'g'), '$1');
  t = t.replace(new RegExp('([' + PUNCT_R + '])[ \\t\\u3000]+', 'g'), '$1');
  // 連續空格縮成一個
  t = t.replace(/[ \t　]{2,}/g, ' ');
  return t;
}

function tidyPunctuation(t) {
  var cjk = '([' + CJK_R + '])';
  // 中文後面的半形標點轉全形
  t = t.replace(new RegExp(cjk + ' *, *', 'g'), '$1，');
  t = t.replace(new RegExp(cjk + ' *\\. *(?![\\d.a-zA-Z])', 'g'), '$1。');
  t = t.replace(new RegExp(cjk + ' *\\? *', 'g'), '$1？');
  t = t.replace(new RegExp(cjk + ' *! *', 'g'), '$1！');
  t = t.replace(new RegExp(cjk + ' *; *', 'g'), '$1；');
  t = t.replace(new RegExp(cjk + ' *: *(?!\\d)', 'g'), '$1：');
  // 刪節號統一
  t = t.replace(/\.{3,}/g, '……');
  t = t.replace(/。{3,}/g, '……');
  // 重複標點合併
  t = t.replace(/，{2,}/g, '，');
  t = t.replace(/。{2,}/g, '。');
  t = t.replace(/、{2,}/g, '、');
  t = t.replace(/？{2,}/g, '？');
  t = t.replace(/！{2,}/g, '！');
  // 標點前的空格移除
  t = t.replace(new RegExp('[ \\t\\u3000]+([' + PUNCT_R + '])', 'g'), '$1');
  return t;
}

function isCjkChar(ch) {
  return new RegExp('[' + ALL_R + ']').test(ch);
}

function mergeLines(t, addComma) {
  var lines = t.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  var hanRe = new RegExp('[' + HAN_R + ']');
  var out = '';
  for (var i = 0; i < lines.length; i++) {
    if (!out) { out = lines[i]; continue; }
    var a = out.charAt(out.length - 1);
    var b = lines[i].charAt(0);
    if (addComma && hanRe.test(a) && hanRe.test(b)) {
      // 字幕斷行通常是語氣停頓：兩側都是中文字且沒有標點時補逗號
      out += '，' + lines[i];
    } else if (isCjkChar(a) || isCjkChar(b)) {
      // 兩側只要有一邊是中文就直接相連；都是英數則補一個空格
      out += lines[i];
    } else {
      out += ' ' + lines[i];
    }
  }
  return out;
}

function paragraphize(t, n) {
  var enders = (t.match(/[。！？…!?]/g) || []).length;
  // 全文沒有句號類標點時（常見於字幕），改用逗號斷句來分段
  if (enders === 0 && t.indexOf('，') !== -1) {
    var clauses = t.match(/[^，]+，?/g) || [t];
    var per = Math.max(3, n * 2);
    var cParas = [];
    for (var j = 0; j < clauses.length; j += per) {
      var cp = clauses.slice(j, j + per).join('').trim().replace(/，$/, '。');
      if (cp) cParas.push(cp);
    }
    return cParas.join('\n\n');
  }
  var parts = t.match(/[^。！？…!?]+[。！？…!?]+[」』）]?|[^。！？…!?]+$/g);
  if (!parts) return t;
  var paras = [];
  for (var i = 0; i < parts.length; i += n) {
    var p = parts.slice(i, i + n).join('').trim();
    if (p) paras.push(p);
  }
  return paras.join('\n\n');
}

function cleanText(input, opts) {
  var t = input;
  if (opts.timestamp) t = removeTimestamps(t);
  if (opts.junk) t = removeJunk(t);
  if (opts.paragraph) {
    t = mergeLines(t, opts.comma);
  } else {
    // 不分段時仍清掉多餘空行
    t = t.replace(/(\r?\n){3,}/g, '\n\n')
         .split(/\r?\n/).map(function (s) { return s.trim(); }).join('\n')
         .replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
  }
  if (opts.space) t = removeSpaces(t, opts.spaceAll);
  if (opts.punct) t = tidyPunctuation(t);
  t = t.trim();
  if (opts.paragraph) t = paragraphize(t, opts.paraN);
  t = t.trim();
  // 結尾若是中文字而沒有標點，補上句號
  if (opts.punct && t && new RegExp('[' + HAN_R + ']$').test(t)) t += '。';
  return t;
}
// ===== CORE-END =====

var $ = function (id) { return document.getElementById(id); };
var inputEl = $('input'), outputEl = $('output');

function getOpts() {
  return {
    timestamp: $('optTimestamp').checked,
    junk: $('optJunk').checked,
    space: $('optSpace').checked,
    spaceAll: $('optSpaceAll').checked,
    punct: $('optPunct').checked,
    comma: $('optComma').checked,
    paragraph: $('optPara').checked,
    paraN: parseInt($('optParaN').value, 10)
  };
}

function countChars(s) { return s.replace(/\s/g, '').length; }

function process() {
  var raw = inputEl.value;
  var result = raw.trim() ? cleanText(raw, getOpts()) : '';
  outputEl.textContent = result;
  $('statIn').textContent = countChars(raw) + ' 字';
  var paraCount = result ? result.split(/\n\n+/).length : 0;
  $('statOut').textContent = countChars(result) + ' 字' + (paraCount ? '，' + paraCount + ' 段' : '');
}

var debounceTimer;
inputEl.addEventListener('input', function () {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(process, 150);
});
['optTimestamp', 'optJunk', 'optSpace', 'optSpaceAll', 'optPunct', 'optComma', 'optPara', 'optParaN'].forEach(function (id) {
  $(id).addEventListener('change', process);
});

function showToast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 1800);
}

$('btnCopy').addEventListener('click', function () {
  var text = outputEl.textContent;
  if (!text) { showToast('沒有可複製的內容'); return; }
  // 視覺上全選結果區的文字，讓使用者看見「全部都選起來了」
  var range = document.createRange();
  range.selectNodeContents(outputEl);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var done = function () { showToast('已全選並複製 ' + text.replace(/\s/g, '').length + ' 字 ✓'); };
  var fallback = function () { document.execCommand('copy'); done(); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
});

$('btnDownload').addEventListener('click', function () {
  var text = outputEl.textContent;
  if (!text) { showToast('沒有可下載的內容'); return; }
  var blob = new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '逐字稿整理_' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('btnClear').addEventListener('click', function () {
  inputEl.value = '';
  process();
  inputEl.focus();
});

$('fileInput').addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { inputEl.value = reader.result; process(); };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

$('btnSample').addEventListener('click', function () {
  inputEl.value = [
    '1',
    '00:00:01,000 --> 00:00:04,500',
    '大家好 歡迎來到 今天的青年聚會',
    '',
    '2',
    '00:00:04,500 --> 00:00:08,000',
    '我們今天 要一起來看 約3:16 這節經文',
    '',
    '00:12 神愛世人 甚至將他的獨生子賜給他們',
    '00:18 叫一切信他的 不至滅亡 反得永生',
    '[00:01:23] 這節經文 告訴我們 神的愛有多大',
    '00:01:30 所以弟兄姊妹 我們可以放心地 來到神面前',
    '00:01:45 因為他先愛了我們 這就是福音 這就是好消息',
    '00:02:00 請不吝點贊 訂閱 轉發 打賞支持明鏡與點點欄目'
  ].join('\n');
  process();
});

process();
</script>
</body>
</html>
